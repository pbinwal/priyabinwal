<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>{{ page.title | default: site.title }} | Priya Binwal</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css" />
    <noscript><link rel="stylesheet" href="{{ site.baseurl }}/assets/css/noscript.css" /></noscript>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/twenty-custom.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/fonts.css" />
    <style>
      #imageModal {
        align-items: center;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        height: 100%;
        justify-content: center;
        left: 0;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 9999;
      }
      #imageModal.is-visible {
        display: flex;
      }
      #modalImage {
        max-height: 85vh;
        max-width: 90vw;
        object-fit: contain;
      }
      #imageModal button {
        background: transparent;
        border: 0;
        color: #fff;
        cursor: pointer;
        font-size: 2rem;
        line-height: 1;
        padding: 0.5rem;
        position: absolute;
        z-index: 1;
      }
      #closeModal {
        right: 1.25rem;
        top: 1rem;
      }
      #fullscreenImage {
        right: 1.35rem;
        top: 4rem;
      }
    </style>
  </head>
  <body class="{{ page.body_class | default: 'is-preload' }}">
    <div id="page-wrapper">

      <!-- Header -->
      <header id="header" class="{{ page.header_class | default: '' }}">
        <h1 id="logo"><a href="{{ site.baseurl }}/">Priya Binwal</a></h1>
        <nav id="nav">
          <ul>
            <li {% if page.url == '/' %}class="current"{% endif %}><a href="{{ site.baseurl }}/">Home</a></li>
            <li {% if page.url contains '/science' %}class="current"{% endif %}><a href="{{ site.baseurl }}/science/">Science</a></li>
            <li {% if page.url contains '/prose' %}class="current"{% endif %}><a href="{{ site.baseurl }}/prose/">Poetry &amp; Prose</a></li>
            <li {% if page.url contains '/anubhuti' %}class="current"{% endif %}><a href="{{ site.baseurl }}/anubhuti/">Anubhuti</a></li>
            <li {% if page.url contains '/ignorants' %}class="current"{% endif %}><a href="{{ site.baseurl }}/ignorants/">IgnoRants</a></li>
            <li {% if page.url contains '/contact' %}class="current"{% endif %}><a href="{{ site.baseurl }}/contact/" class="button primary">Contact</a></li>
          </ul>
        </nav>
      </header>

      <!-- Main content injected from page/markdown -->
      {{ content }}

      <!-- Footer -->
      <footer id="footer">
        <ul class="copyright">
          <li>&copy; {{ 'now' | date: "%Y" }} Priya Binwal</li>
          <li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
        </ul>
      </footer>

    </div>

    <div id="imageModal" role="dialog" aria-label="Image viewer" aria-modal="true" onclick="closeModal()">
      <button id="closeModal" type="button" aria-label="Close image viewer" onclick="event.stopPropagation(); closeModal();">&times;</button>
      <button id="fullscreenImage" type="button" aria-label="View image fullscreen" onclick="event.stopPropagation(); toggleImageFullscreen();">&#x26F6;</button>
      <img id="modalImage" alt="" onclick="event.stopPropagation();">
    </div>

    <!-- Scripts -->
    <script src="{{ site.baseurl }}/assets/js/jquery.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/jquery.dropotron.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/jquery.scrolly.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/jquery.scrollex.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/browser.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/breakpoints.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/util.js"></script>
    <script src="{{ site.baseurl }}/assets/js/main.js"></script>
    <script>
      function openModal(imgSrc) {
        document.getElementById('modalImage').src = imgSrc;
        document.getElementById('imageModal').classList.add('is-visible');
      }

      function closeModal() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        document.getElementById('imageModal').classList.remove('is-visible');
      }

      function toggleImageFullscreen() {
        const image = document.getElementById('modalImage');
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (image.requestFullscreen) {
          image.requestFullscreen();
        }
      }

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeModal();
        }
      });
    </script>
  </body>
</html>
